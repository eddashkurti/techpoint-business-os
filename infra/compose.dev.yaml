name: techpoint-dev
services:
  app:
    build:
      context: ..
      dockerfile: infra/php/Dockerfile
      target: dev
    image: techpoint-php-dev:local
    working_dir: /var/www/html
    env_file:
      - ../.env
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-techpoint}
      DB_USERNAME: ${DB_USERNAME:-techpoint}
      DB_PASSWORD: ${DB_PASSWORD:?Set a local DB_PASSWORD in the ignored root .env}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    volumes:
      - ..:/var/www/html
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks: [private, outbound]
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-techpoint}
      MYSQL_USER: ${DB_USERNAME:-techpoint}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in root .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a distinct MYSQL_ROOT_PASSWORD in root .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--innodb-buffer-pool-size=256M"]
    volumes:
      - dev_mysql:/var/lib/mysql
      - ./mysql/dev-init.sh:/docker-entrypoint-initdb.d/10-testing.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql --user=root --silent --skip-column-names --execute='SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [private]
networks:
  private:
    internal: true
  outbound: {}
volumes:
  dev_mysql: {}
