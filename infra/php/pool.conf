[global]
error_log = /proc/self/fd/2
pid = /tmp/php-fpm.pid
[www]
user = www-data
group = www-data
listen = 9000
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
ping.path = /ping
ping.response = pong
request_terminate_timeout = 65s
